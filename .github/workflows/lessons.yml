# Lessons: the quick check for a pull request that adds or changes a course
# lesson (lessons/CONTRIBUTING.md, ADR 070). It builds only LessonCheck - a
# few minutes, against the full matrix's half hour - and turns each problem
# into a note on the line of the file in the pull request. The full build
# still runs too: it is what checks a Studio lesson's values against the
# Learner knobs' real ranges.
name: Lessons

on:
  pull_request:
    paths:
      - 'lessons/**'
      - 'shared/learning/LessonFile.*'
      - 'shared/learning/KnobGlossary.*'
      - 'Source/OwnPlugins/OwnLesson.*'
      - 'tools/LessonCheck.cpp'
  push:
    branches: [main]
    paths:
      - 'lessons/**'

permissions:
  contents: read

concurrency:
  group: lessons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}

      - name: Build LessonCheck
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target LessonCheck --parallel 2

      - name: Check every lesson
        run: ./build/LessonCheck_artefacts/Release/LessonCheck lessons
