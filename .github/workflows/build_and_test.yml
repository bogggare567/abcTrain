name: Build and Test

on:
  push:
  pull_request:

# Action versions are pinned to the *lowest* major that runs on Node 24,
# not the newest available. Node 20 is deprecated and every run was
# printing a warning about it; that is the thing being fixed. Jumping to
# the newest major would also pick up unrelated behaviour changes -
# download-artifact v5 changed how single-artifact paths resolve, v8
# moved to ESM - in a pipeline whose release job has already been broken
# once by a change nobody could test locally.
#
# Verified by reading each action's own `runs.using`, not its release
# notes. The notes are misleading here: upload-artifact v5 and
# download-artifact v6 both say they "support Node v24", which means
# *compatible with* - they still declare node20 and the runner forces them
# onto 24 with a deprecation warning. The first version of each that
# actually declares node24 is one major higher.
#
#   checkout v5, cache v5        -> node24
#   upload-artifact v6           -> node24  (v5 declares node20)
#   download-artifact v7         -> node24  (v6 declares node20)
#   action-gh-release v3         -> node24
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JUCE's GUI modules need X11/GL headers to compile on Linux even
      # though nothing here actually opens a window in CI - alsa/freetype
      # alone isn't enough, the build fails on missing X11 headers without
      # these too.
      # libcurl-dev is needed for the update-checker: JUCE's Linux networking
      # has no HTTPS support of its own (raw sockets, no TLS) unless built
      # with NEEDS_CURL - see decisions/007-update-checker.md.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --parallel with no number passed to the Unix Makefiles generator
      # means "make -j" with no limit at all, not "one job per core" -
      # that's what OOM-killed the Ubuntu runner building three targets'
      # worth of JUCE unity-build translation units at once. Capping it
      # explicitly is the actual fix; a bigger runner or splitting the
      # build wouldn't address the root cause.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Uploaded right after Build (before running tests) so a build that
      # compiles but fails a test still leaves a downloadable artifact to
      # test manually - upload-artifact zips the given paths on its own, no
      # manual zip step needed. Per-OS name so VST3/AU/Standalone stay
      # separate downloads instead of one mixed-platform blob.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plugins-${{ matrix.os }}
          path: |
            build/EarTrainer_artefacts/Release
            build/LearnerEQ_artefacts/Release
            build/LearnerComp_artefacts/Release
            build/LearnerVerb_artefacts/Release
          if-no-files-found: error

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./build/EarTrainerTests_artefacts/Release/EarTrainerTests

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/EarTrainerTests_artefacts/Release/EarTrainerTests.exe

      # Real, per-OS installers - one component pkg/.dmg for macOS
      # (component-selection + system/user choice via productbuild's
      # native domains toggle), one Inno Setup .exe for Windows (adds a
      # free-text custom path for VST3, unlike macOS), one tar.gz +
      # interactive install.sh for Linux. See
      # decisions/008-installers.md for the whole design and its honest
      # limitations (these builds are unsigned - see that ADR).
      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(cat build/abctrain-version.txt)
          bash installer/macos/build_installer.sh build "abcTrain-macOS-${VERSION}.dmg"

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: installer-macos
          path: abcTrain-macOS-*.dmg
          if-no-files-found: error

      # GitHub-hosted Windows runners have Chocolatey pre-installed and on
      # PATH; `choco install innosetup` shims `iscc` onto PATH too, so it's
      # callable directly in the next step without knowing its install path.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content build/abctrain-version.txt).Trim()
          iscc "installer\windows_setup.iss" "/DMyAppVersion=$version"
          Move-Item "installer\abcTrain-$version-setup.exe" "abcTrain-Windows-$version-setup.exe"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: installer-windows
          path: abcTrain-Windows-*-setup.exe
          if-no-files-found: error

      - name: Build installer (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(cat build/abctrain-version.txt)
          bash installer/linux/package_tar.sh build "abcTrain-Linux-${VERSION}.tar.gz"

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: installer-linux
          path: abcTrain-Linux-*.tar.gz
          if-no-files-found: error

  # Only runs on a `vX.Y.Z` tag push, after all three OSes have built and
  # tested successfully (`needs:` + the matrix job's own default fail
  # behavior means a failing OS blocks the release). `push:` with no
  # branches/tags filter above already triggers this workflow on tag
  # pushes, so no separate `on:` entry is needed for that.
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Only the raw plugins-* build output gets re-zipped here - the
      # three real installers (installer-macos/-windows/-linux) are
      # already packaged appropriately (.dmg/.exe/.tar.gz) and get
      # attached to the release as-is below.
      - name: Zip each OS's raw plugin artifacts for release
        run: |
          cd artifacts
          for dir in plugins-*/; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/plugins-*.zip
            artifacts/installer-macos/*.dmg
            artifacts/installer-windows/*.exe
            artifacts/installer-linux/*.tar.gz
          generate_release_notes: true
