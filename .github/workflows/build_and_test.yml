name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JUCE's GUI modules need X11/GL headers to compile on Linux even
      # though nothing here actually opens a window in CI - alsa/freetype
      # alone isn't enough, the build fails on missing X11 headers without
      # these too.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --parallel with no number passed to the Unix Makefiles generator
      # means "make -j" with no limit at all, not "one job per core" -
      # that's what OOM-killed the Ubuntu runner building three targets'
      # worth of JUCE unity-build translation units at once. Capping it
      # explicitly is the actual fix; a bigger runner or splitting the
      # build wouldn't address the root cause.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ./build/EarTrainerTests_artefacts/Release/EarTrainerTests

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/EarTrainerTests_artefacts/Release/EarTrainerTests.exe
