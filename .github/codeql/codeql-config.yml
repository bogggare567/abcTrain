name: abcTrain CodeQL config

# What CodeQL should and should not look at.

queries:
  # security-extended, not the default set and not security-and-quality.
  #
  # Wider than the default because this project's real bug history is
  # memory-safety shaped - a use-after-free reading a temporary's
  # DynamicObject, an editor-owned buffer the audio thread kept reading
  # after the window had closed - and both of those were found by hand
  # rather than by any tool.
  #
  # Narrower than security-and-quality because that suite piles
  # maintainability and style queries on top, and on a four-plugin C++
  # codebase that is a few hundred alerts about naming and unused locals.
  # A Security tab nobody opens is worse than no Security tab: the real
  # finding, when it eventually arrives, arrives on page four.
  - uses: security-extended

# These apply to the **JavaScript** analysis only.
#
# GitHub's own documentation is explicit about the limit: path filters
# work "when you run the CodeQL actions on an interpreted language ... or
# when you analyze a compiled language *without building the code*". This
# repository builds its C++, so nothing here reaches the C++ analysis.
#
# An earlier version of this file claimed the opposite - that the filter
# trimmed the results rather than the extraction - and it was simply
# wrong. The C++ scan reports ~45 findings, every one of them inside
# build/_deps: JUCE itself and the libraries it vendors (harfbuzz, zlib,
# libvorbis, jpeglib). Zero are in abcTrain's own code.
#
# The documented way to exclude a directory from a *built* analysis is to
# stop building it, which is not an option when the framework is the
# thing being built against. So those findings are triaged in the
# Security tab instead - dismissed as third-party - rather than pretended
# away here.
paths-ignore:
  # The Vite output: minified duplicates of website/src, which is scanned.
  - website/dist/**
  - website/node_modules/**
  # Generated at build time from the C++ sources - see
  # website/tools/sync-from-plugin.mjs.
  - website/src/generated/**
